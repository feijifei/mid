<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>低频量化平台</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260909-1">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">LQ</span><span>低频量化平台</span></div>
    <nav>
      <button class="nav-item active" data-view="overview">总览</button>
      <button class="nav-item" data-view="research">策略研究</button>
      <button class="nav-item" data-view="trading">模拟交易</button>
    </nav>
    <div class="environment"><span class="status-dot"></span><span id="data-source-status">读取数据源</span></div>
  </aside>

  <main>
    <header>
      <div><h1 id="page-title">运行总览</h1><p id="as-of">正在读取平台状态</p></div>
      <div class="header-actions">
        <button id="reload-strategies" class="secondary">重新加载策略</button>
        <a class="icon-link" href="/docs" title="接口文档" aria-label="接口文档">API</a>
      </div>
    </header>

    <section id="overview" class="view active">
      <div class="metrics" aria-live="polite">
        <article><span>模拟账户权益</span><strong id="equity">--</strong><small class="currency-unit">人民币</small></article>
        <article><span>模拟账户可用资金</span><strong id="cash">--</strong><small class="currency-unit">人民币</small></article>
        <article><span>模拟账户持仓市值</span><strong id="market-value">--</strong><small class="currency-unit">人民币</small></article>
        <article><span>风控状态</span><strong class="risk-ok">正常</strong><small>模拟环境</small></article>
      </div>
      <div class="panel chart-panel">
        <div class="panel-heading chart-heading">
          <div><h2>默认策略净值</h2><p id="chart-description">东方财富日频行情，下一交易日开盘成交</p></div>
          <div class="backtest-controls">
            <div class="market-control" data-active="cn" aria-label="研究市场">
              <button class="market-option active" data-market="cn" aria-pressed="true">A股</button>
              <button class="market-option" data-market="pink" aria-pressed="false">OTC</button>
            </div>
            <div class="period-control" aria-label="回测周期">
              <button class="period-option" data-period="1m">1个月</button>
              <button class="period-option" data-period="3m">3个月</button>
              <button class="period-option" data-period="6m">半年</button>
              <button class="period-option active" data-period="1y">1年</button>
              <button class="period-option" data-period="all">全部</button>
            </div>
            <button id="open-universe" class="secondary">选股</button>
            <button id="run-backtest">运行回测</button>
          </div>
        </div>
        <div class="series-toolbar">
          <span>显示曲线</span>
          <div id="series-control" class="series-control" aria-label="收益曲线">
            <button class="series-option active" aria-pressed="true" data-series="portfolio"><span class="series-swatch portfolio"></span>总体组合</button>
          </div>
          <div class="trade-key"><span class="buy-key">▲ 买入</span><span class="sell-key">▼ 卖出</span></div>
        </div>
        <div id="chart" class="chart"><span>点击“运行回测”生成权益曲线</span></div>
        <div id="trade-detail" class="trade-detail" aria-live="polite"><span>交易事件</span><strong>未选择</strong></div>
        <div id="backtest-metrics" class="metric-strip"></div>
      </div>
      <div class="two-column">
        <section class="panel"><div class="panel-heading"><div><h2 id="positions-title">模拟持仓</h2><p id="positions-as-of">--</p></div></div><div class="table-wrap"><table><thead><tr><th>证券</th><th>数量</th><th>成本</th><th>现价</th><th>市值</th></tr></thead><tbody id="positions"></tbody></table></div></section>
        <section class="panel"><div class="panel-heading"><h2>最近订单</h2></div><div class="table-wrap"><table><thead><tr><th>证券</th><th>方向</th><th>数量</th><th>状态</th></tr></thead><tbody id="orders"></tbody></table></div></section>
      </div>
    </section>

    <section id="research" class="view">
      <div class="panel">
        <div class="panel-heading"><div><h2>策略插件</h2><p>插件只输出目标权重，不能直接下单</p></div></div>
        <div id="strategy-list" class="strategy-list"></div>
      </div>
    </section>

    <section id="trading" class="view">
      <div class="panel trading-panel">
        <div><h2>模拟调仓</h2><p>执行策略生成、订单规划、事前风控和即时模拟成交。相同批次使用确定性订单ID，重复执行不会重复下单。</p></div>
        <button id="paper-rebalance">执行模拟调仓</button>
        <button id="reset-demo" class="danger">重置模拟账户</button>
        <pre id="trade-result">尚未执行</pre>
      </div>
    </section>
    <div id="toast" role="status"></div>
    <dialog id="universe-dialog">
      <form id="universe-form" method="dialog">
        <div class="dialog-heading"><div><h2>模拟标的池</h2><p>股票或ETF代码</p></div><button type="button" class="icon-button" id="close-universe" aria-label="关闭">×</button></div>
        <div id="universe-list" class="universe-list"></div>
        <label class="symbol-input"><span>添加证券</span><input id="symbol-input" inputmode="numeric" maxlength="6" placeholder="例如 600519" autocomplete="off"><button type="submit">添加</button></label>
        <p id="universe-error" class="form-error" role="alert"></p>
        <button type="button" id="apply-universe" class="dialog-primary">应用并回测</button>
      </form>
    </dialog>
  </main>
  <script src="/static/app.js?v=20260909-1"></script>
</body>
</html>
